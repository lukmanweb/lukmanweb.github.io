<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pertanyaan Penting 😈</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.07;
      animation: floatUp linear infinite;
      pointer-events: none;
    }
    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg); }
      100% { transform: translateY(-10vh) rotate(360deg); }
    }

    /* Card — posisinya kita kontrol via JS */
    .card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 28px;
      padding: 50px 44px 44px;
      text-align: center;
      width: 90%;
      max-width: 460px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
      position: fixed;        /* fixed agar bisa digerakkan bebas */
      z-index: 10;
      /* Posisi awal diatur JS */
      transition: left 0.18s cubic-bezier(.25,.8,.25,1),
                  top  0.18s cubic-bezier(.25,.8,.25,1);
    }

    .emoji-top {
      font-size: 3rem;
      margin-bottom: 18px;
      display: block;
      animation: bounce 2s ease-in-out infinite;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    h1 {
      font-size: clamp(1.1rem, 4vw, 1.45rem);
      font-weight: 800;
      color: #fff;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.4);
      margin-bottom: 32px;
    }

    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .btn {
      padding: 15px 38px;
      font-family: inherit;
      font-weight: 800;
      font-size: 1.05rem;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-ya {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      box-shadow: 0 6px 20px rgba(34,197,94,0.4);
    }
    .btn-ya:hover { transform: scale(1.07); }
    .btn-ya:active { transform: scale(0.97); }

    .btn-tidak {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      box-shadow: 0 6px 20px rgba(239,68,68,0.4);
    }
    /* tidak punya hover effect biasa — form yang kabur */

    /* Hint kecil */
    .hint {
      margin-top: 18px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.25);
      min-height: 18px;
      transition: color 0.3s;
    }

    /* Pesan sukses */
    .result {
      display: none;
      margin-top: 24px;
      padding: 18px 22px;
      background: linear-gradient(135deg, rgba(34,197,94,0.15), rgba(16,185,129,0.1));
      border: 1px solid rgba(34,197,94,0.35);
      border-radius: 16px;
      color: #4ade80;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.6;
      animation: popIn 0.4s cubic-bezier(.34,1.56,.64,1) both;
    }
    .result.show { display: block; }
    @keyframes popIn {
      from { opacity:0; transform: scale(0.7); }
      to   { opacity:1; transform: scale(1);   }
    }
    .result-emoji { font-size: 1.8rem; display: block; margin-bottom: 8px; }

    /* Confetti */
    .confetti-piece {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      border-radius: 2px;
      animation: confettiFall 1.8s ease-in forwards;
    }
    @keyframes confettiFall {
      0%   { opacity:1; transform: translateY(-20px) rotate(0deg); }
      100% { opacity:0; transform: translateY(100vh) rotate(720deg); }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <span class="emoji-top">💰</span>
    <h1>Apakah Anda puas<br>dengan gaji Anda?</h1>
    <p class="sub">Jawab dengan jujur ya...</p>

    <div class="btn-group">
      <button class="btn btn-ya"    id="btnYa"    onclick="jawabYa()">✅ Ya</button>
      <button class="btn btn-tidak" id="btnTidak"
              onmouseenter="kabur()"
              onmousemove="kabur()"
              ontouchstart="kabur()"
              onclick="kabur()">❌ Tidak</button>
    </div>

    <p class="hint" id="hint">Coba sentuh tombol "Tidak" 😏</p>

    <div class="result" id="result">
      <span class="result-emoji">🎉</span>
      Oke sip, silahkan lanjutkan bekerja!<br>
      <span style="color:rgba(255,255,255,0.5); font-size:0.82rem;">haha 😄</span>
    </div>
  </div>

<script>
  const card   = document.getElementById('card');
  const hint   = document.getElementById('hint');
  let count    = 0;
  let cardW, cardH;

  /* Taruh card di tengah layar */
  function centerCard() {
    cardW = card.offsetWidth;
    cardH = card.offsetHeight;
    card.style.left = ((window.innerWidth  - cardW) / 2) + 'px';
    card.style.top  = ((window.innerHeight - cardH) / 2) + 'px';
  }
  window.addEventListener('load',   centerCard);
  window.addEventListener('resize', centerCard);

  /* Kabur = card berpindah ke posisi acak */
  function kabur() {
    cardW = card.offsetWidth;
    cardH = card.offsetHeight;
    const margin = 20;
    const maxX   = window.innerWidth  - cardW - margin;
    const maxY   = window.innerHeight - cardH - margin;

    let newX, newY;
    // Pastikan posisi baru berbeda cukup jauh dari posisi saat ini
    const curX = parseFloat(card.style.left) || 0;
    const curY = parseFloat(card.style.top)  || 0;
    let attempts = 0;
    do {
      newX = margin + Math.random() * maxX;
      newY = margin + Math.random() * maxY;
      attempts++;
    } while (
      Math.abs(newX - curX) < 120 &&
      Math.abs(newY - curY) < 80  &&
      attempts < 20
    );

    card.style.left = newX + 'px';
    card.style.top  = newY + 'px';

    count++;
    if (count === 1)  hint.textContent = 'Susah ya? 😂';
    else if (count === 3)  hint.textContent = 'Masih mau coba? 🤣';
    else if (count === 5)  hint.textContent = 'Terus-terusin aja~ 😈';
    else if (count >= 8)   hint.textContent = `Sudah ${count}x gagal... mending pilih YA aja 😭`;
  }

  /* Klik Ya */
  function jawabYa() {
    // Stop kabur
    document.getElementById('btnTidak').onmouseenter = null;
    document.getElementById('btnTidak').onmousemove  = null;
    document.getElementById('btnTidak').ontouchstart = null;
    document.getElementById('btnTidak').onclick      = null;

    // Kembalikan ke tengah dulu
    card.style.transition = 'left 0.4s cubic-bezier(.34,1.56,.64,1), top 0.4s cubic-bezier(.34,1.56,.64,1)';
    cardW = card.offsetWidth;
    cardH = card.offsetHeight;
    card.style.left = ((window.innerWidth  - cardW) / 2) + 'px';
    card.style.top  = ((window.innerHeight - cardH) / 2) + 'px';

    // Disable tombol Ya
    document.getElementById('btnYa').disabled = true;
    document.getElementById('btnYa').style.opacity = '0.6';
    hint.style.display = 'none';

    // Tampilkan hasil
    setTimeout(() => {
      document.getElementById('result').classList.add('show');
    }, 300);

    spawnConfetti();
  }

  /* Confetti */
  function spawnConfetti() {
    const colors = ['#22c55e','#facc15','#60a5fa','#f472b6','#fb923c','#a78bfa','#fff'];
    for (let i = 0; i < 70; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        const size = Math.random() * 9 + 6;
        el.style.cssText = `
          width:${size}px; height:${size}px;
          left:${Math.random()*100}vw; top:-20px;
          background:${colors[Math.floor(Math.random()*colors.length)]};
          animation-duration:${(Math.random()*1+1.3).toFixed(2)}s;
        `;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2600);
      }, i * 28);
    }
  }

  /* Particles latar */
  const cols = ['#6366f1','#8b5cf6','#ec4899','#14b8a6','#f59e0b'];
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const s = Math.random()*80+20;
    p.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}vw;
      background:${cols[Math.floor(Math.random()*cols.length)]};
      animation-duration:${(Math.random()*15+10).toFixed(1)}s;
      animation-delay:-${(Math.random()*15).toFixed(1)}s;`;
    document.body.appendChild(p);
  }
</script>
</body>
</html>
