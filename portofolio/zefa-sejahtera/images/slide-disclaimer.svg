<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f17" />
      <stop offset="50%" stop-color="#0c3b2e" />
      <stop offset="100%" stop-color="#124f3e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09362a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#041f17" stop-opacity="0.98" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Decorative Rings -->
  <circle cx="600" cy="400" r="360" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="10 8"/>
  <circle cx="600" cy="400" r="320" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.25"/>
  <circle cx="150" cy="150" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.08"/>
  <circle cx="1050" cy="650" r="240" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Main Outer Frame -->
  <rect x="36" y="36" width="1128" height="728" rx="24" fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#goldGlow)"/>
  <rect x="48" y="48" width="1104" height="704" rx="18" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Corner Ornaments -->
  <path d="M 60 90 L 60 60 L 90 60" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <path d="M 1140 90 L 1140 60 L 1110 60" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <path d="M 60 710 L 60 740 L 90 740" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <path d="M 1140 710 L 1140 740 L 1110 740" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- Center Card -->
  <rect x="140" y="90" width="920" height="620" rx="24" fill="url(#cardGrad)" stroke="url(#goldGrad)" stroke-width="2" filter="url(#dropShadow)"/>

  <!-- Icon Section -->
  <g transform="translate(600, 240)">
    
  <!-- Outer Gold Laurel / Sunburst -->
  <circle cx="0" cy="-5" r="95" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Big Official Crest Shield -->
  <path d="M 0 -115 L 85 -80 L 85 20 C 85 75 0 115 0 115 C 0 115 -85 75 -85 20 L -85 -80 Z" fill="#0c3b2e" stroke="url(#goldGrad)" stroke-width="5" filter="url(#dropShadow)"/>
  <path d="M 0 -98 L 70 -70 L 70 15 C 70 60 0 95 0 95 C 0 95 -70 60 -70 15 L -70 -70 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Certified Legal Seal / Checkmark / Star in center -->
  <polygon points="0,-60 12,-25 48,-25 20,-3 30,32 0,12 -30,32 -20,-3 -48,-25 -12,-25" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
  <circle cx="0" 55" r="14" fill="url(#goldGrad)"/>
  <path d="M -6 55 L -2 59 L 7 50" fill="none" stroke="#0c3b2e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  </g>

  <!-- Typography -->
  <text x="600" y="440" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="40" font-weight="900" fill="url(#goldGrad)" letter-spacing="3" filter="url(#goldGlow)">
    PERLINDUNGAN HUKUM &amp; BRAND
  </text>

  <text x="600" y="495" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="2">
    LEGALITAS &amp; KEPATUHAN RESMI
  </text>

  <!-- Gold Divider -->
  <line x1="420" y1="525" x2="780" y2="525" stroke="url(#goldGrad)" stroke-width="2"/>
  <polygon points="600,517 608,525 600,533 592,525" fill="url(#goldGrad)"/>

  <text x="600" y="565" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.85)" letter-spacing="1">
    Hak Cipta Terdaftar &bull; Perlindungan Merk Resmi &bull; Regulasi Direct Selling
  </text>

  <!-- Bottom Badge -->
  <g transform="translate(420, 610)">
    <rect width="360" height="48" rx="24" fill="#041f17" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text x="180" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="800" fill="url(#goldGrad)" letter-spacing="2">
      PT ZEFA MULIA SEJAHTERA
    </text>
  </g>
</svg>