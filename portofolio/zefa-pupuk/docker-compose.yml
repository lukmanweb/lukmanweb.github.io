version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile_inline: |
        FROM php:8.2-apache
        RUN docker-php-ext-install pdo pdo_mysql
        RUN a2enmod rewrite
        RUN echo '<Directory /var/www/html>\n  AllowOverride All\n  Require all granted\n</Directory>' >> /etc/apache2/apache2.conf
    container_name: zefa-pupuk
    ports:
      - "8888:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: zefa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zefa_pupuk
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
      - zefa_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  zefa_mysql_data:
