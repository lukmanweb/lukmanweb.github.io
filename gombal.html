<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>💌 Chat Romantis</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      height: 100dvh;
      position: relative;
    }

    /* ===== TOP BAR (Chat Header) ===== */
    .topbar {
      background: #1a1a2e;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }
    .back-arrow {
      color: #ec4899;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .partner-avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #be185d, #7e22ce);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      position: relative;
      transition: transform 0.3s;
    }
    .partner-avatar.react {
      animation: avatarReact 0.5s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes avatarReact {
      0%  { transform: scale(1); }
      40% { transform: scale(1.3) rotate(-8deg); }
      70% { transform: scale(0.95) rotate(5deg); }
      100%{ transform: scale(1) rotate(0deg); }
    }
    .online-dot {
      width: 10px; height: 10px;
      background: #22c55e;
      border-radius: 50%;
      border: 2px solid #1a1a2e;
      position: absolute;
      bottom: 1px; right: 1px;
    }
    .partner-info h3 {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }
    .partner-info span {
      font-size: 0.72rem;
      color: #22c55e;
      font-weight: 600;
    }
    .partner-info .typing-status {
      font-size: 0.72rem;
      color: #ec4899;
      display: none;
    }

    /* Meter di topbar */
    .meter-mini {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .meter-mini-bar {
      width: 60px; height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
    }
    .meter-mini-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ec4899, #a855f7);
      border-radius: 10px;
      transition: width 0.6s cubic-bezier(.34,1.56,.64,1);
      box-shadow: 0 0 8px rgba(236,72,153,0.6);
    }
    .meter-mini-icon { font-size: 1rem; }

    /* ===== CHAT AREA ===== */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background:
        radial-gradient(ellipse at 15% 30%, rgba(236,72,153,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 70%, rgba(139,92,246,0.08) 0%, transparent 50%),
        #0f0f1a;
      scroll-behavior: smooth;
    }
    .chat-area::-webkit-scrollbar { width: 3px; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(236,72,153,0.3); border-radius: 3px; }

    /* Date badge */
    .date-badge {
      text-align: center;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.05);
      padding: 4px 12px;
      border-radius: 20px;
      align-self: center;
      margin: 4px 0;
    }

    /* Partner message (left) */
    .msg-partner {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      align-self: flex-start;
      max-width: 82%;
      animation: msgIn 0.3s ease both;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .msg-avatar-sm {
      width: 30px; height: 30px; min-width: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #be185d, #7e22ce);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
    }
    .bubble-left {
      background: #1e1e35;
      border: 1px solid rgba(236,72,153,0.2);
      border-radius: 18px 18px 18px 4px;
      padding: 10px 14px;
      color: #f3e8ff;
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .bubble-left .emotion {
      font-size: 0.68rem;
      color: #ec4899;
      font-weight: 700;
      margin-bottom: 4px;
      display: block;
    }
    .bubble-left .time {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.25);
      margin-top: 4px;
      display: block;
      text-align: right;
    }

    /* Typing bubble */
    .typing-bubble {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      align-self: flex-start;
    }
    .typing-inner {
      background: #1e1e35;
      border: 1px solid rgba(236,72,153,0.2);
      border-radius: 18px 18px 18px 4px;
      padding: 12px 16px;
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .dot {
      width: 7px; height: 7px;
      background: #ec4899; border-radius: 50%; opacity: 0.6;
      animation: dotBounce 0.9s ease-in-out infinite;
    }
    .dot:nth-child(2){ animation-delay: 0.2s; }
    .dot:nth-child(3){ animation-delay: 0.4s; }
    @keyframes dotBounce {
      0%,60%,100%{ transform: translateY(0); }
      30%        { transform: translateY(-6px); }
    }

    /* Player message (right) */
    .msg-me {
      align-self: flex-end;
      max-width: 82%;
      animation: msgInRight 0.3s ease both;
    }
    @keyframes msgInRight {
      from { opacity: 0; transform: translateX(14px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .bubble-right {
      background: linear-gradient(135deg, rgba(236,72,153,0.35), rgba(168,85,247,0.3));
      border: 1px solid rgba(236,72,153,0.4);
      border-radius: 18px 18px 4px 18px;
      padding: 10px 14px;
      color: #fce7f3;
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .bubble-right .time {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.3);
      margin-top: 4px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 3px;
    }
    .read-tick { color: #60a5fa; font-size: 0.7rem; }

    /* ===== CHOICE AREA (bottom) ===== */
    .choice-area {
      flex-shrink: 0;
      background: #1a1a2e;
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 12px 12px 16px;
    }
    .choice-label {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
      margin-bottom: 8px;
      padding-left: 2px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .choices-grid {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .choice-btn {
      padding: 11px 14px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: rgba(255,255,255,0.8);
      font-family: inherit;
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 9px;
      transition: all 0.18s;
      line-height: 1.35;
    }
    .choice-btn:hover, .choice-btn:focus {
      background: rgba(236,72,153,0.15);
      border-color: rgba(236,72,153,0.45);
      color: #fce7f3;
      transform: translateX(3px);
    }
    .choice-btn:active { transform: scale(0.97); }
    .choice-btn.selected {
      background: rgba(236,72,153,0.2);
      border-color: rgba(236,72,153,0.5);
      color: #fce7f3;
      pointer-events: none;
    }
    .choice-btn.disabled {
      opacity: 0.35;
      pointer-events: none;
    }
    .btn-icon { font-size: 1rem; min-width: 20px; }

    /* ===== END CARD ===== */
    .end-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      display: none;
    }
    .end-card {
      background: #1a1a2e;
      border: 1px solid rgba(236,72,153,0.4);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      width: 100%;
      max-width: 360px;
      animation: popIn 0.4s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .end-emoji { font-size: 3.5rem; margin-bottom: 12px; display: block; }
    .end-title { font-size: 1.35rem; font-weight: 800; margin-bottom: 8px; color: #fce7f3; }
    .end-desc  { font-size: 0.83rem; color: rgba(255,255,255,0.5); line-height: 1.6; margin-bottom: 22px; }
    .end-btns  { display: flex; flex-direction: column; gap: 10px; }
    .btn-wa {
      padding: 13px;
      background: rgba(37,211,102,0.15);
      border: 1.5px solid rgba(37,211,102,0.4);
      border-radius: 12px;
      color: #4ade80;
      font-family: inherit; font-weight: 700; font-size: 0.88rem;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-wa:hover { background: rgba(37,211,102,0.28); }
    .btn-ulang {
      padding: 13px;
      background: rgba(236,72,153,0.15);
      border: 1.5px solid rgba(236,72,153,0.4);
      border-radius: 12px;
      color: #f9a8d4;
      font-family: inherit; font-weight: 700; font-size: 0.88rem;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-ulang:hover { background: rgba(236,72,153,0.28); }

    /* Floating hearts */
    .fh {
      position: fixed; pointer-events: none; z-index: 50;
      animation: fhRise linear forwards; opacity: 0;
    }
    @keyframes fhRise {
      0%  { opacity: 0; transform: translateY(0) scale(0.6); }
      15% { opacity: 0.8; }
      85% { opacity: 0.3; }
      100%{ opacity: 0; transform: translateY(-100vh) scale(1.2) rotate(20deg); }
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <span class="back-arrow">←</span>
  <div class="partner-avatar" id="partnerAvatar">
    😊
    <div class="online-dot"></div>
  </div>
  <div class="partner-info">
    <h3>Sayangku 💕</h3>
    <span id="onlineStatus">Online sekarang</span>
    <div class="typing-status" id="typingStatus">sedang mengetik...</div>
  </div>
  <div class="meter-mini">
    <span class="meter-mini-icon">💕</span>
    <div class="meter-mini-bar">
      <div class="meter-mini-fill" id="meterFill"></div>
    </div>
  </div>
</div>

<!-- CHAT AREA -->
<div class="chat-area" id="chatArea">
  <div class="date-badge">Hari ini</div>
</div>

<!-- CHOICE AREA -->
<div class="choice-area" id="choiceArea">
  <div class="choice-label">Pilih balasanmu</div>
  <div class="choices-grid" id="choicesGrid"></div>
</div>

<!-- END OVERLAY -->
<div class="end-overlay" id="endOverlay">
  <div class="end-card">
    <span class="end-emoji" id="endEmoji">💍</span>
    <h2 class="end-title" id="endTitle">Kamu berhasil!</h2>
    <p class="end-desc"  id="endDesc">Deskripsi</p>
    <div class="end-btns">
      <button class="btn-wa"    onclick="shareWA()">💬 Kirim ke Pasangan via WA</button>
      <button class="btn-ulang" onclick="resetGame()">🔄 Mulai Lagi</button>
    </div>
  </div>
</div>

<script>
// Jam sekarang
function nowTime() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

// ===== SKENARIO =====
const scenes = [
  {
    avatar: '😊',
    partnerMsg: 'Haii... kamu kenapa tiba-tiba chat aku? 😏',
    emotion: '',
    choices: [
      { icon:'🌹', text:'Aku cuma mau bilang... kamu cantik banget hari ini.',            score: 20 },
      { icon:'😅', text:'Eh, nggak ada sih. Basa-basi aja hehe.',                         score: -5 },
      { icon:'💌', text:'Aku lagi kangen kamu. Boleh chat kamu kan?',                     score: 18 },
      { icon:'😏', text:'Punya rahasia nih, tapi nggak yakin kamu siap dengerin...',       score: 15 },
    ]
  },
  {
    avatar: '🤩',
    partnerMsg: 'Ih serius?! Ayo-ayo, lanjut! Aku penasaran deh~ 😍',
    emotion: '',
    choices: [
      { icon:'💫', text:'Matamu itu kayak bintang. Aku bisa nyasar selamanya di dalamnya.', score: 28 },
      { icon:'🌸', text:'Senyummu penawar dari semua lelahku seharian ini.',               score: 25 },
      { icon:'☕', text:'Kamu kayak kopi pagi — tanpa kamu, hariku nggak lengkap.',       score: 22 },
      { icon:'🤐', text:'Eh lupa mau ngomong apa. Haha.',                                 score: -8 },
    ]
  },
  {
    avatar: '😳',
    partnerMsg: 'Hiii kamu lebay banget sih! 😳 Tapi... aku suka dengerin kamu...',
    emotion: '',
    choices: [
      { icon:'💝', text:'Ini baru 10% dari yang aku rasain benerannya loh.',              score: 30 },
      { icon:'🌺', text:'Biarin lebay, yang penting jujur dari hati.',                     score: 26 },
      { icon:'🤭', text:'Maaf ya kalau berlebihan. Tapi kamu emang spesial buat aku.',    score: 24 },
      { icon:'😂', text:'Haha iya deh. Aku emang begini orangnya.',                        score:  5 },
    ]
  },
  {
    avatar: '🥰',
    partnerMsg: 'Aduh... kamu bikin aku susah berhenti senyum-senyum sendiri nih! 🫠',
    emotion: '',
    choices: [
      { icon:'💌', text:'Itu emang tujuannya~ Aku suka lihat kamu senyum.',              score: 32 },
      { icon:'🌙', text:'Serius, itu semua tulus. Aku nggak pernah bohong sama kamu.',    score: 28 },
      { icon:'😏', text:'Baper itu tandanya kamu juga merasakannya kan? 😏',              score: 30 },
      { icon:'😶', text:'Oh... aku nggak nyangka efeknya segini.',                        score: 10 },
    ]
  },
  {
    avatar: '😍',
    partnerMsg: 'Kamu ini... aku mau jawab apa ya? 😭💕',
    emotion: '',
    choices: [
      { icon:'🌹', text:'Nggak usah jawab. Senyummu udah cukup jadi jawabannya.',        score: 35 },
      { icon:'💬', text:'Jawab aja jujur. Apapun jawabannya, aku siap.',                  score: 27 },
      { icon:'💖', text:'Kamu nggak perlu jawab sekarang. Aku akan tetap di sini.',       score: 32 },
      { icon:'😜', text:'Jawab dong! Aku udah nggak sabar nih!',                          score: 12 },
    ]
  },
  {
    avatar: '🌸',
    partnerMsg: 'Aku... aku nggak bisa bohong. Aku bahagia banget chat sama kamu hari ini 🌸❤️',
    emotion: '',
    choices: [
      { icon:'💞', text:'Itu yang aku mau. Kamu selalu bahagia, terutama gara-gara aku.',   score: 40 },
      { icon:'🌟', text:'Semoga senyummu selalu ada, hari ini, besok, dan selamanya.',       score: 38 },
      { icon:'💌', text:'Kamu layak bahagia. Dan aku ingin selalu jadi alasannya.',          score: 42 },
      { icon:'😘', text:'Sama. Aku juga bahagia bisa cerita kayak gini sama kamu 😘',        score: 33 },
    ]
  },
];

let currentScene = 0;
let totalScore   = 0;
let maxScore     = 0;
let lastChoice   = '';
let busy         = false;

scenes.forEach(s => { maxScore += Math.max(...s.choices.map(c => c.score)); });

// ===== RENDER SCENE =====
function renderScene(idx) {
  busy = false;
  const s = scenes[idx];

  // Show typing indicator
  showTyping().then(() => {
    // Show partner message
    addPartnerMsg(s.avatar, s.partnerMsg);
    // Show choices
    renderChoices(s.choices);
    // Update avatar
    document.getElementById('partnerAvatar').textContent = s.avatar + '\n';
    document.getElementById('partnerAvatar').innerHTML =
      s.avatar + '<div class="online-dot"></div>';
  });
}

function showTyping() {
  return new Promise(resolve => {
    const chatArea = document.getElementById('chatArea');
    // Typing indicator
    const typingEl = document.createElement('div');
    typingEl.className = 'typing-bubble';
    typingEl.id = 'typingBubble';
    typingEl.innerHTML = `
      <div class="msg-avatar-sm">${scenes[currentScene]?.avatar || '😊'}</div>
      <div class="typing-inner">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>`;
    chatArea.appendChild(typingEl);
    scrollBottom();

    // Show typing status in topbar
    document.getElementById('onlineStatus').style.display   = 'none';
    document.getElementById('typingStatus').style.display   = 'block';

    setTimeout(() => {
      typingEl.remove();
      document.getElementById('onlineStatus').style.display = 'block';
      document.getElementById('typingStatus').style.display = 'none';
      resolve();
    }, 1200);
  });
}

function addPartnerMsg(avatar, text) {
  const chatArea = document.getElementById('chatArea');
  const wrap = document.createElement('div');
  wrap.className = 'msg-partner';
  wrap.innerHTML = `
    <div class="msg-avatar-sm">${avatar}</div>
    <div class="bubble-left">
      ${text}
      <span class="time">${nowTime()}</span>
    </div>`;
  chatArea.appendChild(wrap);
  scrollBottom();

  // Avatar react
  const av = document.getElementById('partnerAvatar');
  av.classList.remove('react');
  void av.offsetWidth;
  av.classList.add('react');
  setTimeout(() => av.classList.remove('react'), 600);
}

function addMyMsg(text) {
  const chatArea = document.getElementById('chatArea');
  const wrap = document.createElement('div');
  wrap.className = 'msg-me';
  wrap.innerHTML = `
    <div class="bubble-right">
      ${text}
      <div class="time">${nowTime()} <span class="read-tick">✓✓</span></div>
    </div>`;
  chatArea.appendChild(wrap);
  scrollBottom();
}

function renderChoices(choices) {
  const grid = document.getElementById('choicesGrid');
  grid.innerHTML = '';
  choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="btn-icon">${c.icon}</span><span>${c.text}</span>`;
    btn.onclick = () => pick(c, btn, choices);
    grid.appendChild(btn);
  });
}

function pick(choice, btn, allChoices) {
  if (busy) return;
  busy = true;

  // Mark selected
  document.querySelectorAll('.choice-btn').forEach(b => b.classList.add('disabled'));
  btn.classList.remove('disabled');
  btn.classList.add('selected');

  // My bubble
  addMyMsg(choice.text);
  lastChoice = choice.text;

  // Score
  const pts = Math.max(0, choice.score);
  totalScore += pts;
  updateMeter();
  if (choice.score >= 20) burstHearts(choice.score >= 32 ? 12 : 7);

  // Clear choices & go next
  setTimeout(() => {
    document.getElementById('choicesGrid').innerHTML = '';
    currentScene++;
    if (currentScene < scenes.length) {
      renderScene(currentScene);
    } else {
      showEnd();
    }
  }, 700);
}

function updateMeter() {
  const pct = Math.min(100, Math.round((totalScore / maxScore) * 100));
  document.getElementById('meterFill').style.width = pct + '%';
}

function scrollBottom() {
  const ca = document.getElementById('chatArea');
  setTimeout(() => { ca.scrollTop = ca.scrollHeight; }, 50);
}

// ===== END GAME =====
function showEnd() {
  const pct = Math.round((totalScore / maxScore) * 100);
  let emoji, title, desc;
  if      (pct >= 85){ emoji='💍'; title='GOMBAL MASTERCLASS!';     desc=`Skor ${pct}/100 🔥 — Kamu berhasil melelehkan hatinya sepenuhnya! Dia pasti sudah jatuh cinta!`; }
  else if (pct >= 65){ emoji='💖'; title='Gombal Level Pro!';       desc=`Skor ${pct}/100 😍 — Kata-katamu berhasil buat dia baper besar! Tinggal satu langkah lagi~`; }
  else if (pct >= 45){ emoji='🌸'; title='Lumayan Romantis~';       desc=`Skor ${pct}/100 🙂 — Dia mulai tertarik! Coba lebih romantis lain kali ya.`; }
  else               { emoji='😅'; title='Perlu Belajar Lagi~';     desc=`Skor ${pct}/100 😅 — Kurang greget nih. Coba ulang dengan pilihan yang lebih manis!`; }

  document.getElementById('endEmoji').textContent = emoji;
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endDesc').textContent  = desc;
  document.getElementById('endOverlay').style.display = 'flex';

  if (pct >= 65) burstHearts(20);
}

function resetGame() {
  currentScene = 0; totalScore = 0; lastChoice = '';
  document.getElementById('meterFill').style.width = '0%';
  document.getElementById('endOverlay').style.display = 'none';
  const ca = document.getElementById('chatArea');
  ca.innerHTML = '<div class="date-badge">Hari ini</div>';
  renderScene(0);
}

function shareWA() {
  const pct = Math.round((totalScore / maxScore) * 100);
  const msg = encodeURIComponent(
    `💌 Hai sayang...\n\n"${lastChoice}"\n\n` +
    `(Skor gombal aku: ${pct}/100 💕)\n` +
    `— dikirim pakai gombal.html`
  );
  window.open('https://wa.me/?text=' + msg, '_blank');
}

// Floating hearts
function burstHearts(n = 8) {
  const emojis = ['❤️','💕','💖','🌹','✨','💘','🌸','💗'];
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      const h = document.createElement('div');
      h.className = 'fh';
      h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      h.style.fontSize = (0.9 + Math.random() * 1) + 'rem';
      h.style.left   = (10 + Math.random() * 80) + 'vw';
      h.style.bottom = '80px';
      h.style.animationDuration = (3 + Math.random() * 3) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 6500);
    }, i * 110);
  }
}
