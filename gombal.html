<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💌 Gombalin Dia — Pilih Kata-Katamu!</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      background: #0d0415;
      color: #fff;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 80px;
    }

    /* BG gradient animated */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(ellipse at 15% 40%, rgba(236,72,153,0.2) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 20%, rgba(139,92,246,0.2) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 90%, rgba(219,39,119,0.15) 0%, transparent 50%),
        #0d0415;
    }

    /* Stars */
    .stars { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    .star {
      position: absolute; background: white; border-radius: 50%;
      animation: twinkle linear infinite;
    }
    @keyframes twinkle {
      0%,100%{ opacity:.1; transform: scale(1); }
      50%     { opacity:.75; transform: scale(1.4); }
    }

    /* ===== HEADER ===== */
    .header {
      text-align: center; margin-bottom: 24px; width: 100%; max-width: 520px;
    }
    .badge {
      display: inline-block;
      background: rgba(236,72,153,0.15);
      border: 1px solid rgba(236,72,153,0.4);
      color: #f9a8d4; padding: 5px 14px;
      border-radius: 20px; font-size: 0.75rem; font-weight: 700;
      margin-bottom: 12px; letter-spacing: .5px;
    }
    .header h1 {
      font-size: clamp(1.5rem,5vw,2.1rem);
      font-weight: 900;
      background: linear-gradient(135deg,#f9a8d4,#ec4899,#a855f7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .header p { color:rgba(255,255,255,.4); font-size:.82rem; }

    /* ===== ROMANCE METER ===== */
    .meter-wrap {
      width: 100%; max-width: 520px; margin-bottom: 20px;
    }
    .meter-top {
      display: flex; justify-content: space-between;
      font-size: .75rem; color: rgba(255,255,255,.4); margin-bottom: 5px;
    }
    .meter-bar {
      height: 10px; background: rgba(255,255,255,.08); border-radius: 10px; overflow: hidden;
    }
    .meter-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #ec4899, #a855f7);
      border-radius: 10px;
      transition: width .7s cubic-bezier(.34,1.56,.64,1);
      box-shadow: 0 0 12px rgba(236,72,153,.5);
    }

    /* ===== CHARACTER AREA ===== */
    .char-area {
      width: 100%; max-width: 520px;
      display: flex; align-items: flex-end; gap: 14px;
      margin-bottom: 18px;
    }
    .avatar {
      width: 72px; height: 72px; min-width: 72px;
      border-radius: 50%;
      border: 3px solid rgba(236,72,153,.5);
      background: linear-gradient(135deg, #1e0a2e, #3b0f5e);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem;
      box-shadow: 0 0 20px rgba(236,72,153,.3);
      animation: avatarPulse 3s ease-in-out infinite;
      transition: transform .3s;
    }
    @keyframes avatarPulse {
      0%,100%{ box-shadow: 0 0 20px rgba(236,72,153,.3); }
      50%    { box-shadow: 0 0 35px rgba(236,72,153,.55); }
    }
    .avatar.react { animation: avatarReact .5s cubic-bezier(.34,1.56,.64,1); }
    @keyframes avatarReact {
      0%  { transform: scale(1); }
      40% { transform: scale(1.25) rotate(-8deg); }
      70% { transform: scale(.95) rotate(5deg); }
      100%{ transform: scale(1) rotate(0deg); }
    }

    /* Chat bubble (partner) */
    .bubble-partner {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(236,72,153,.25);
      border-radius: 18px 18px 18px 4px;
      padding: 14px 18px;
      font-size: .92rem;
      color: #fdf2f8;
      line-height: 1.55;
      flex: 1;
      position: relative;
      min-height: 60px;
    }
    .bubble-partner .typing-dots {
      display: inline-flex; gap: 4px; align-items: center;
    }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #ec4899; opacity: .6;
      animation: dotBounce .9s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2){ animation-delay:.2s; }
    .typing-dots span:nth-child(3){ animation-delay:.4s; }
    @keyframes dotBounce {
      0%,60%,100%{ transform: translateY(0); }
      30%        { transform: translateY(-6px); }
    }

    .emotion-tag {
      display: inline-block;
      font-size: .7rem; font-weight: 700;
      background: rgba(236,72,153,.2);
      border: 1px solid rgba(236,72,153,.35);
      color: #f9a8d4;
      padding: 2px 10px; border-radius: 20px;
      margin-bottom: 6px;
    }

    /* ===== PLAYER BUBBLE ===== */
    .bubble-player-wrap {
      width: 100%; max-width: 520px;
      display: flex; justify-content: flex-end;
      margin-bottom: 20px;
    }
    .bubble-player {
      background: linear-gradient(135deg, rgba(236,72,153,.25), rgba(168,85,247,.2));
      border: 1px solid rgba(236,72,153,.35);
      border-radius: 18px 18px 4px 18px;
      padding: 12px 18px;
      font-size: .9rem;
      color: #fce7f3;
      max-width: 75%;
      font-style: italic;
      display: none;
    }
    .bubble-player.show { display: block; animation: slideIn .35s ease both; }
    @keyframes slideIn {
      from{ opacity:0; transform: translateX(20px); }
      to  { opacity:1; transform: translateX(0); }
    }

    /* ===== CHOICE BUTTONS ===== */
    .choices {
      width: 100%; max-width: 520px;
      display: flex; flex-direction: column; gap: 10px;
      margin-bottom: 22px;
    }
    .choice-btn {
      padding: 14px 20px;
      background: rgba(255,255,255,.06);
      border: 1.5px solid rgba(255,255,255,.12);
      border-radius: 14px;
      color: rgba(255,255,255,.85);
      font-family: inherit;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all .2s;
      display: flex; align-items: center; gap: 10px;
    }
    .choice-btn:hover {
      background: rgba(236,72,153,.15);
      border-color: rgba(236,72,153,.45);
      color: #fce7f3;
      transform: translateX(4px);
    }
    .choice-btn:active { transform: scale(.97); }
    .choice-btn .btn-icon {
      font-size: 1.1rem; min-width: 24px; text-align: center;
    }
    .choice-btn.disabled {
      opacity: .4; pointer-events: none;
    }

    /* ===== BOTTOM ACTION ===== */
    .bottom-row {
      width: 100%; max-width: 520px;
      display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    }
    .btn-next {
      flex: 1; min-width: 140px;
      padding: 14px 20px;
      background: linear-gradient(135deg, #ec4899, #a855f7);
      color: white; border: none; border-radius: 12px;
      font-family: inherit; font-weight: 800; font-size: .9rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(236,72,153,.4);
      transition: all .2s;
    }
    .btn-next:hover { transform: translateY(-2px); }
    .btn-reset {
      padding: 14px 20px;
      background: rgba(255,255,255,.07);
      border: 1.5px solid rgba(255,255,255,.15);
      color: rgba(255,255,255,.7);
      border-radius: 12px;
      font-family: inherit; font-weight: 700; font-size: .9rem;
      cursor: pointer;
      transition: all .2s;
    }
    .btn-reset:hover { background: rgba(255,255,255,.13); }
    .btn-share-wa {
      padding: 14px 20px;
      background: rgba(37,211,102,.15);
      border: 1.5px solid rgba(37,211,102,.35);
      color: #4ade80;
      border-radius: 12px;
      font-family: inherit; font-weight: 700; font-size: .9rem;
      cursor: pointer;
      transition: all .2s;
    }
    .btn-share-wa:hover { background: rgba(37,211,102,.25); }

    /* Score popup */
    .score-pop {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%,-50%) scale(0);
      background: rgba(15,4,21,.92);
      border: 2px solid rgba(236,72,153,.5);
      border-radius: 24px;
      padding: 40px 50px;
      text-align: center;
      z-index: 999;
      transition: transform .4s cubic-bezier(.34,1.56,.64,1);
      backdrop-filter: blur(20px);
    }
    .score-pop.show { transform: translate(-50%,-50%) scale(1); }
    .score-pop h2 { font-size: 1.5rem; margin-bottom: 8px; }
    .score-pop .big-emoji { font-size: 3.5rem; margin-bottom: 14px; display: block; }
    .score-pop p { color: rgba(255,255,255,.6); font-size: .85rem; margin-bottom: 20px; line-height: 1.6; }

    /* Floating hearts */
    .fheart {
      position: fixed; pointer-events: none; z-index: 0;
      font-size: 1.2rem; opacity: 0;
      animation: fhRise linear forwards;
    }
    @keyframes fhRise {
      0%  { opacity:0; transform: translateY(0) scale(.7); }
      15% { opacity:.7; }
      85% { opacity:.3; }
      100%{ opacity:0; transform: translateY(-100vh) scale(1.2) rotate(20deg); }
    }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: rgba(30,30,50,.95);
      border: 1px solid rgba(236,72,153,.4);
      color: #f9a8d4; padding: 10px 22px;
      border-radius: 30px; font-size: .82rem; font-weight: 700;
      z-index: 9999; opacity: 0;
      transition: all .35s cubic-bezier(.34,1.56,.64,1);
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- Header -->
<div class="header">
  <div class="badge">💌 Gombal Interaktif</div>
  <h1>Gombalin Dia Sekarang! 🌹</h1>
  <p>Pilih kata-katamu & lihat reaksi pasanganmu!</p>
</div>

<!-- Meter -->
<div class="meter-wrap">
  <div class="meter-top">
    <span>💕 Meter Cinta</span>
    <span id="meterLabel">0 / 100</span>
  </div>
  <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
</div>

<!-- Character -->
<div class="char-area">
  <div class="avatar" id="avatar">😊</div>
  <div class="bubble-partner" id="bubblePartner">
    <span class="typing-dots"><span></span><span></span><span></span></span>
  </div>
</div>

<!-- Player bubble -->
<div class="bubble-player-wrap">
  <div class="bubble-player" id="bubblePlayer"></div>
</div>

<!-- Choices -->
<div class="choices" id="choices"></div>

<!-- Bottom -->
<div class="bottom-row" id="bottomRow" style="display:none">
  <button class="btn-next" id="btnNext" onclick="nextScene()">Lanjut ➜</button>
  <button class="btn-reset" onclick="resetGame()">🔄 Ulang</button>
  <button class="btn-share-wa" id="btnShareWA" onclick="shareWA()" style="display:none">💬 Kirim WA</button>
</div>

<!-- Score popup -->
<div class="score-pop" id="scorePop">
  <span class="big-emoji" id="popEmoji">🎉</span>
  <h2 id="popTitle">Selamat!</h2>
  <p id="popDesc">Kamu berhasil menggombal pasanganmu!</p>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px">
    <button class="btn-next" onclick="resetGame()" style="font-size:.85rem;padding:12px 20px">🔄 Main Lagi</button>
    <button class="btn-share-wa" onclick="shareResult()" style="font-size:.85rem;padding:12px 20px">💬 Kirim WA</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== SCENES DATA =====
const scenes = [
  {
    partnerText: "Hai... kamu mau ngomong apa sih hari ini? 😏",
    emotion: "😏 Penasaran",
    avatar: "😊",
    choices: [
      { icon:"🌹", text: "Aku mau bilang sesuatu yang udah lama aku pendam...", score: 15, next: 1 },
      { icon:"😅", text: "Eh... nggak ada sih, basa-basi aja.", score: -5, next: 1 },
      { icon:"🥰", text: "Aku cuma mau bilang... kamu cantik banget hari ini.", score: 20, next: 1 },
      { icon:"😈", text: "Kamu tau nggak, aku punya satu rahasia tentang kamu...", score: 10, next: 1 },
    ]
  },
  {
    partnerText: "Ih serius? Terus-terus, lanjutin dong~",
    emotion: "🤩 Excited",
    avatar: "🤩",
    choices: [
      { icon:"💫", text: "Matamu itu kayak bintang... aku bisa nyasar selamanya di dalamnya.", score: 25, next: 2 },
      { icon:"🌸", text: "Senyummu itu penawar dari segala lelahku seharian.", score: 20, next: 2 },
      { icon:"☕", text: "Kamu itu kayak kopi — tanpa kamu, hariku nggak akan pernah produktif.", score: 15, next: 2 },
      { icon:"😂", text: "Eh lupa mau ngomong apa. Hehe.", score: -10, next: 2 },
    ]
  },
  {
    partnerText: "Aish... kamu lebay banget deh! 😳 Tapi aku suka...",
    emotion: "😳 Malu-Malu",
    avatar: "😳",
    choices: [
      { icon:"💝", text: "Lebay? Nggak dong. Ini baru 10% dari yang aku rasain benerannya.", score: 30, next: 3 },
      { icon:"🌺", text: "Biarin lebay, yang penting itu jujur dari hati.", score: 25, next: 3 },
      { icon:"😇", text: "Maaf ya kalau berlebihan, tapi kamu emang spesial buat aku.", score: 20, next: 3 },
      { icon:"😂", text: "Haha iya deh, aku emang lebay. Serius sih.", score: 5, next: 3 },
    ]
  },
  {
    partnerText: "Stop stop stop... kamu bikin aku baper banget tau nggak! 🫠",
    emotion: "🫠 Luluh",
    avatar: "🥰",
    choices: [
      { icon:"💌", text: "Itu emang tujuannya~ Aku suka lihat kamu baper.", score: 30, next: 4 },
      { icon:"🌙", text: "Maaf kalau ganggu. Tapi jujur, itu semua tulus.", score: 25, next: 4 },
      { icon:"🎯", text: "Baper itu tanda kamu juga merasakannya kan? 😏", score: 28, next: 4 },
      { icon:"😶", text: "Oh... aku nggak nyangka efeknya segini.", score: 10, next: 4 },
    ]
  },
  {
    partnerText: "Aduh... aku mau jawab apa ya? Kamu ini...",
    emotion: "💘 Jatuh Cinta",
    avatar: "😍",
    choices: [
      { icon:"🌹", text: "Nggak usah jawab. Senyummu udah cukup jadi jawabannya.", score: 35, next: 5 },
      { icon:"💬", text: "Jawab aja jujur. Aku siap dengerin apapun.", score: 25, next: 5 },
      { icon:"💖", text: "Kamu nggak perlu jawab sekarang. Aku akan tetap di sini.", score: 30, next: 5 },
      { icon:"😜", text: "Jawab dong! Aku penasaran banget!", score: 10, next: 5 },
    ]
  },
  {
    partnerText: "Aku... aku nggak bisa berhenti senyum-senyum sendiri deh gara-gara kamu! 🌸",
    emotion: "🌸 Bahagia",
    avatar: "🌸",
    choices: [
      { icon:"💞", text: "Itu yang aku mau. Kamu selalu bahagia, apalagi gara-gara aku.", score: 40, next: -1, final: true },
      { icon:"🌟", text: "Semoga senyummu selalu ada, hari ini, besok, dan selamanya.", score: 38, next: -1, final: true },
      { icon:"💌", text: "Kamu layak bahagia. Dan aku ingin jadi alasannya selalu.", score: 42, next: -1, final: true },
      { icon:"😘", text: "Hehe, makasih ya udah mau dengerin gombalanku hari ini 😘", score: 30, next: -1, final: true },
    ]
  }
];

let currentScene = 0;
let totalScore = 0;
let maxScore = 0;
let lastChoice = '';
let chosen = false;

// Count max possible score
scenes.forEach(s => { maxScore += Math.max(...s.choices.map(c => c.score)); });

function renderScene(idx) {
  const s = scenes[idx];
  chosen = false;

  // Avatar
  document.getElementById('avatar').textContent = s.avatar;

  // Partner typing animation then show text
  const bubble = document.getElementById('bubblePartner');
  bubble.innerHTML = `<span class="typing-dots"><span></span><span></span><span></span></span>`;

  setTimeout(() => {
    bubble.innerHTML = `<span class="emotion-tag">${s.emotion}</span><br>${s.partnerText}`;
    bubble.style.animation = 'none'; void bubble.offsetWidth;
    bubble.style.animation = 'slideIn .4s ease both';
  }, 900);

  // Hide player bubble
  const pb = document.getElementById('bubblePlayer');
  pb.textContent = '';
  pb.classList.remove('show');

  // Render choices
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  s.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="btn-icon">${c.icon}</span><span>${c.text}</span>`;
    btn.onclick = () => selectChoice(c, i, btn);
    choicesEl.appendChild(btn);
  });

  document.getElementById('bottomRow').style.display = 'none';
}

function selectChoice(choice, idx, btn) {
  if (chosen) return;
  chosen = true;

  // Disable all
  document.querySelectorAll('.choice-btn').forEach(b => b.classList.add('disabled'));
  btn.classList.remove('disabled');
  btn.style.background = 'rgba(236,72,153,0.25)';
  btn.style.borderColor = 'rgba(236,72,153,0.6)';
  btn.style.color = '#fce7f3';

  // Show player bubble
  const pb = document.getElementById('bubblePlayer');
  pb.textContent = choice.text;
  pb.classList.remove('show');
  void pb.offsetWidth;
  pb.classList.add('show');

  lastChoice = choice.text;

  // Score
  const pts = Math.max(0, choice.score);
  totalScore += pts;
  updateMeter();

  // Burst hearts if positive
  if (choice.score >= 20) burstHearts(choice.score >= 30 ? 12 : 7);

  // Avatar react
  const av = document.getElementById('avatar');
  av.classList.remove('react');
  void av.offsetWidth;
  av.classList.add('react');
  setTimeout(() => av.classList.remove('react'), 600);

  // Show next button
  const bottomRow = document.getElementById('bottomRow');
  bottomRow.style.display = 'flex';

  if (choice.final) {
    document.getElementById('btnNext').style.display = 'none';
    document.getElementById('btnShareWA').style.display = 'block';
    setTimeout(() => showResult(), 1200);
  } else {
    document.getElementById('btnNext').style.display = 'block';
    document.getElementById('btnShareWA').style.display = 'none';
  }
}

function nextScene() {
  if (!chosen) { showToast('⚠️ Pilih dulu ya!'); return; }
  currentScene++;
  if (currentScene < scenes.length) renderScene(currentScene);
}

function updateMeter() {
  const pct = Math.min(100, Math.round((totalScore / maxScore) * 100));
  document.getElementById('meterFill').style.width = pct + '%';
  document.getElementById('meterLabel').textContent = `${pct} / 100`;
}

function showResult() {
  const pct = Math.round((totalScore / maxScore) * 100);
  let emoji, title, desc;

  if (pct >= 85) {
    emoji = '💍'; title = 'GOMBAL MASTERCLASS!';
    desc = `Skor kamu ${pct}/100 🔥\nKamu berhasil melelehkan hatinya sepenuhnya! Dia pasti sudah jatuh cinta sama kamu!`;
  } else if (pct >= 65) {
    emoji = '💖'; title = 'Gombal Level Pro!';
    desc = `Skor kamu ${pct}/100 😍\nKata-katamu berhasil membuat dia baper! Tinggal selangkah lagi menuju hatinya~`;
  } else if (pct >= 45) {
    emoji = '🌸'; title = 'Lumayan nih!';
    desc = `Skor kamu ${pct}/100 🙂\nDia mulai tertarik! Coba lebih romantis lain kali ya~`;
  } else {
    emoji = '😅'; title = 'Perlu Banyak Belajar~';
    desc = `Skor kamu ${pct}/100 😅\nDia kurang terkesan nih. Coba lagi dengan pilihan yang lebih manis!`;
  }

  document.getElementById('popEmoji').textContent = emoji;
  document.getElementById('popTitle').textContent = title;
  document.getElementById('popDesc').textContent = desc;
  document.getElementById('scorePop').classList.add('show');

  if (pct >= 65) burstHearts(20);
}

function resetGame() {
  currentScene = 0;
  totalScore = 0;
  lastChoice = '';
  chosen = false;
  document.getElementById('meterFill').style.width = '0%';
  document.getElementById('meterLabel').textContent = '0 / 100';
  document.getElementById('scorePop').classList.remove('show');
  renderScene(0);
}

function shareWA() {
  const pct = Math.round((totalScore / maxScore) * 100);
  const msg = encodeURIComponent(
    `💌 *Hasil Gombal Interaktif*\n\n` +
    `Skor Cinta: ${pct}/100 💕\n\n` +
    `Kata terbaikku:\n"${lastChoice}"\n\n` +
    `Coba juga di: https://lukmanweb.github.io/gombal.html`
  );
  window.open('https://wa.me/?text=' + msg, '_blank');
}

function shareResult() {
  shareWA();
  document.getElementById('scorePop').classList.remove('show');
}

// Hearts burst
function burstHearts(count = 8) {
  const emojis = ['❤️','💕','💖','💗','🌹','✨','💘','🌸'];
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const h = document.createElement('div');
      h.className = 'fheart';
      h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      h.style.left   = (10 + Math.random()*80) + 'vw';
      h.style.bottom = '0';
      h.style.animationDuration = (3 + Math.random()*3) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 6500);
    }, i * 100);
  }
}

// Toast
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// Stars
const starsEl = document.getElementById('stars');
for (let i = 0; i < 70; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = Math.random()*2.5+.5;
  s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}vw;top:${Math.random()*100}vh;animation-duration:${(Math.random()*4+2).toFixed(1)}s;animation-delay:-${(Math.random()*5).toFixed(1)}s;`;
  starsEl.appendChild(s);
}

// Ambient floating hearts
setInterval(() => {
  if (Math.random() > .7) {
    const h = document.createElement('div');
    h.className = 'fheart';
    h.textContent = ['❤️','💕','✨','🌹','💫','🌸'][Math.floor(Math.random()*6)];
    h.style.left = Math.random()*100 + 'vw';
    h.style.bottom = '0';
    h.style.fontSize = (.7+Math.random()*.7) + 'rem';
    h.style.animationDuration = (8+Math.random()*7) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 15000);
  }
}, 1500);

// Start
renderScene(0);
</script>
</body>
</html>
