<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>💌 Gombal Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0f0f1a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100dvh;
    }

    /* ===== PICK SCREEN ===== */
    .pick-screen {
      position: fixed; inset: 0; z-index: 200;
      background:
        radial-gradient(ellipse at 20% 40%, rgba(236,72,153,0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 60%, rgba(139,92,246,0.18) 0%, transparent 55%),
        #0d0415;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 28px 20px; text-align: center;
    }
    .pick-logo { font-size: 3rem; margin-bottom: 16px; animation: bounce 2s ease-in-out infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .pick-screen h2 {
      font-size: clamp(1.4rem,5vw,1.9rem); font-weight: 900;
      background: linear-gradient(135deg,#f9a8d4,#ec4899,#a855f7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 6px;
    }
    .pick-screen > p { color: rgba(255,255,255,0.4); font-size: 0.83rem; margin-bottom: 32px; }
    .pick-label-sub {
      font-size: 0.73rem; color: rgba(255,255,255,0.35);
      margin-bottom: 12px; font-weight: 600; letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .pick-cards {
      display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
      width: 100%; max-width: 380px;
    }
    .pick-card {
      flex: 1; min-width: 140px; max-width: 170px;
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 22px; padding: 26px 14px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(.34,1.56,.64,1);
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .pick-card:hover { transform: translateY(-6px) scale(1.04); }
    .pick-card.girl { border-color: rgba(244,114,182,0.35); }
    .pick-card.boy  { border-color: rgba(96,165,250,0.35); }
    .pick-card.girl:hover { border-color:#f472b6; background:rgba(244,114,182,0.1); box-shadow:0 16px 40px rgba(244,114,182,0.25); }
    .pick-card.boy:hover  { border-color:#60a5fa; background:rgba(96,165,250,0.1);  box-shadow:0 16px 40px rgba(96,165,250,0.25); }
    .pick-emoji { font-size: 3rem; }
    .pick-name  { font-size: 0.88rem; font-weight: 800; color: #fff; }
    .pick-desc  { font-size: 0.7rem; color: rgba(255,255,255,0.35); font-weight: 600; }

    /* ===== PHONE FRAME ===== */
    .phone {
      width: 100%; max-width: 420px;
      height: 100dvh; max-height: 820px;
      display: none; flex-direction: column;
      background: #0f0f1a;
      position: relative; overflow: hidden;
    }

    /* Top bar */
    .topbar {
      background: rgba(26,26,46,0.98);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      padding: 10px 14px;
      display: flex; align-items: center; gap: 11px;
      flex-shrink: 0; z-index: 10;
    }
    .back-btn {
      color: #ec4899; font-size: 1.1rem; cursor: pointer;
      padding: 4px 6px; border-radius: 8px;
      transition: background 0.15s;
    }
    .back-btn:hover { background: rgba(236,72,153,0.15); }
    .partner-av {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg,#be185d,#7e22ce);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; position: relative;
      transition: transform 0.3s;
    }
    .partner-av.react { animation: avReact 0.5s cubic-bezier(.34,1.56,.64,1); }
    @keyframes avReact {
      0%{transform:scale(1)} 40%{transform:scale(1.3) rotate(-8deg)}
      70%{transform:scale(0.95) rotate(5deg)} 100%{transform:scale(1)}
    }
    .online-dot {
      width: 9px; height: 9px; background: #22c55e;
      border-radius: 50%; border: 2px solid #1a1a2e;
      position: absolute; bottom: 1px; right: 1px;
    }
    .partner-info h3 { font-size: 0.92rem; font-weight: 800; color: #fff; }
    .partner-info .status { font-size: 0.68rem; color: #22c55e; font-weight: 600; }
    .partner-info .typing { font-size: 0.68rem; color: #ec4899; display: none; }

    /* Meter kanan atas */
    .meter-wrap { margin-left: auto; display: flex; align-items: center; gap: 5px; }
    .meter-track { width: 55px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
    .meter-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg,#ec4899,#a855f7);
      border-radius: 10px;
      transition: width 0.7s cubic-bezier(.34,1.56,.64,1);
      box-shadow: 0 0 8px rgba(236,72,153,0.5);
    }

    /* Chat scroll area */
    .chat {
      flex: 1; overflow-y: auto; padding: 14px 12px 10px;
      display: flex; flex-direction: column; gap: 8px;
      background:
        radial-gradient(ellipse at 15% 30%,rgba(236,72,153,0.06) 0%,transparent 50%),
        radial-gradient(ellipse at 85% 70%,rgba(139,92,246,0.06) 0%,transparent 50%),
        #0f0f1a;
    }
    .chat::-webkit-scrollbar { width: 2px; }
    .chat::-webkit-scrollbar-thumb { background: rgba(236,72,153,0.3); border-radius: 2px; }

    .date-badge {
      text-align: center; font-size: 0.68rem; color: rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.05); padding: 3px 12px;
      border-radius: 20px; align-self: center; margin-bottom: 4px;
    }

    /* Bubble KIRI (pasangan) */
    .row-left { display: flex; align-items: flex-end; gap: 7px; align-self: flex-start; max-width: 85%; }
    .av-sm { width: 28px; height: 28px; min-width: 28px; border-radius: 50%;
      background: linear-gradient(135deg,#be185d,#7e22ce);
      display: flex; align-items: center; justify-content: center; font-size: 0.95rem; }
    .bubble-left {
      background: #1e1e35; border: 1px solid rgba(236,72,153,0.2);
      border-radius: 16px 16px 16px 3px;
      padding: 9px 13px; color: #f3e8ff; font-size: 0.85rem; line-height: 1.5;
    }
    .bubble-left .time { font-size: 0.62rem; color: rgba(255,255,255,0.25); margin-top: 3px; text-align: right; }

    /* Bubble KANAN (kamu) */
    .row-right { align-self: flex-end; max-width: 85%; }
    .bubble-right {
      background: linear-gradient(135deg,rgba(236,72,153,0.3),rgba(168,85,247,0.25));
      border: 1px solid rgba(236,72,153,0.38);
      border-radius: 16px 16px 3px 16px;
      padding: 9px 13px; color: #fce7f3; font-size: 0.85rem; line-height: 1.5;
    }
    .bubble-right .time {
      font-size: 0.62rem; color: rgba(255,255,255,0.3); margin-top: 3px;
      display: flex; justify-content: flex-end; align-items: center; gap: 3px;
    }
    .tick { color: #60a5fa; font-size: 0.72rem; }

    /* Typing indicator */
    .typing-row { display: flex; align-items: flex-end; gap: 7px; align-self: flex-start; }
    .typing-bubble {
      background: #1e1e35; border: 1px solid rgba(236,72,153,0.2);
      border-radius: 16px 16px 16px 3px;
      padding: 10px 14px; display: flex; gap: 4px; align-items: center;
    }
    .dot { width: 6px; height: 6px; background: #ec4899; border-radius: 50%; opacity: 0.6;
      animation: dotB 0.9s ease-in-out infinite; }
    .dot:nth-child(2){ animation-delay:.2s; }
    .dot:nth-child(3){ animation-delay:.4s; }
    @keyframes dotB { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

    /* Animasi masuk pesan */
    .anim-left  { animation: msgL 0.3s ease both; }
    .anim-right { animation: msgR 0.3s ease both; }
    @keyframes msgL { from{opacity:0;transform:translateX(-12px)} to{opacity:1;transform:translateX(0)} }
    @keyframes msgR { from{opacity:0;transform:translateX(12px)}  to{opacity:1;transform:translateX(0)} }

    /* ===== BOTTOM AREA ===== */
    .bottom {
      flex-shrink: 0;
      background: rgba(26,26,46,0.98);
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 12px 14px 16px;
    }
    .preview-box {
      background: rgba(236,72,153,0.08);
      border: 1px solid rgba(236,72,153,0.2);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 10px;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.55);
      font-style: italic;
      min-height: 44px;
      line-height: 1.5;
    }
    .preview-box span { color: #f9a8d4; }
    .send-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg,#ec4899,#a855f7);
      color: white; border: none; border-radius: 14px;
      font-family: inherit; font-weight: 800; font-size: 0.95rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 6px 20px rgba(236,72,153,0.4);
      transition: all 0.2s;
    }
    .send-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(236,72,153,0.5); }
    .send-btn:active { transform: scale(0.97); }
    .send-btn:disabled { opacity: 0.5; pointer-events: none; }
    .progress-text {
      text-align: center; font-size: 0.68rem; color: rgba(255,255,255,0.25);
      margin-top: 8px; font-weight: 600;
    }

    /* ===== END OVERLAY ===== */
    .end-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.88); backdrop-filter: blur(12px);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .end-card {
      background: #1a1a2e; border: 1px solid rgba(236,72,153,0.4);
      border-radius: 26px; padding: 36px 26px; text-align: center;
      width: 100%; max-width: 340px;
      animation: popIn 0.4s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes popIn { from{transform:scale(0.8);opacity:0} to{transform:scale(1);opacity:1} }
    .end-big { font-size: 3.5rem; margin-bottom: 12px; display: block; }
    .end-title { font-size: 1.3rem; font-weight: 900; color: #fce7f3; margin-bottom: 8px; }
    .end-desc  { font-size: 0.82rem; color: rgba(255,255,255,0.5); line-height: 1.65; margin-bottom: 22px; }
    .end-btns  { display: flex; flex-direction: column; gap: 10px; }
    .btn-wa {
      padding: 13px; background: rgba(37,211,102,0.15);
      border: 1.5px solid rgba(37,211,102,0.4); border-radius: 12px;
      color: #4ade80; font-family: inherit; font-weight: 700; font-size: 0.87rem;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-wa:hover { background: rgba(37,211,102,0.28); }
    .btn-ulang {
      padding: 13px; background: rgba(236,72,153,0.15);
      border: 1.5px solid rgba(236,72,153,0.4); border-radius: 12px;
      color: #f9a8d4; font-family: inherit; font-weight: 700; font-size: 0.87rem;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-ulang:hover { background: rgba(236,72,153,0.28); }

    /* Floating hearts */
    .fh {
      position: fixed; pointer-events: none; z-index: 50; opacity: 0;
      animation: fhUp linear forwards;
    }
    @keyframes fhUp {
      0%  { opacity:0; transform:translateY(0) scale(0.6); }
      15% { opacity:0.8; }
      85% { opacity:0.3; }
      100%{ opacity:0; transform:translateY(-100vh) scale(1.2) rotate(20deg); }
    }
  </style>
</head>
<body>

<!-- ===== PICK SCREEN ===== -->
<div class="pick-screen" id="pickScreen">
  <div class="pick-logo">💌</div>
  <h2>Mau gombalin siapa?</h2>
  <p>Pilih pasanganmu, terus kamu yang ngirim gombal deh~</p>
  <p class="pick-label-sub">Kamu adalah...</p>
  <div class="pick-cards">
    <div class="pick-card girl" onclick="startGame('girl')">
      <span class="pick-emoji">👩</span>
      <span class="pick-name">Cewek</span>
      <span class="pick-desc">Gombal ke pacar cowok 💙</span>
    </div>
    <div class="pick-card boy" onclick="startGame('boy')">
      <span class="pick-emoji">👨</span>
      <span class="pick-name">Cowok</span>
      <span class="pick-desc">Gombal ke pacar cewek 💗</span>
    </div>
  </div>
</div>

<!-- ===== PHONE / CHAT UI ===== -->
<div class="phone" id="phone">

  <!-- Topbar -->
  <div class="topbar">
    <span class="back-btn" onclick="backToMenu()">←</span>
    <div class="partner-av" id="partnerAv">😊<div class="online-dot"></div></div>
    <div class="partner-info">
      <h3 id="partnerName">Sayangku 💕</h3>
      <span class="status" id="statusOnline">Online</span>
      <span class="typing" id="statusTyping">sedang mengetik...</span>
    </div>
    <div class="meter-wrap">
      💕<div class="meter-track"><div class="meter-bar" id="meterBar"></div></div>
    </div>
  </div>

  <!-- Chat area -->
  <div class="chat" id="chat">
    <div class="date-badge">Hari ini</div>
  </div>

  <!-- Bottom -->
  <div class="bottom">
    <div class="preview-box" id="previewBox">
      <span>Tekan tombol untuk kirim gombal pertama~ 💌</span>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendNext()">
      💌 Kirim Gombal
    </button>
    <div class="progress-text" id="progressText"></div>
  </div>
</div>

<!-- End overlay -->
<div class="end-overlay" id="endOverlay">
  <div class="end-card">
    <span class="end-big" id="endBig">💍</span>
    <h2 class="end-title" id="endTitle">Berhasil!</h2>
    <p class="end-desc" id="endDesc">–</p>
    <div class="end-btns">
      <button class="btn-wa" onclick="shareWA()">💬 Kirim Bukti Gombal via WA</button>
      <button class="btn-ulang" onclick="resetGame()">🔄 Gombal Lagi</button>
    </div>
  </div>
</div>

<script>
// ===== DATA GOMBAL =====
// Format: { gombal: "...", reaksi: "...", avatar: "emoji", level: 1-5 }

const dataGirl = [
  { gombal:"Kak, maaf ya ganggu. Tapi aku nggak bisa nahan diri buat nggak bilang... kamu ganteng banget hari ini 😳", reaksi:"Hah?! Apaan sih tiba-tiba~", avatar:"😏", level:1 },
  { gombal:"Seriusan deh. Tiap kali kamu senyum, aku lupa mau ngomong apa.", reaksi:"Ih kamu bisa aja deh lebaynya 🙈", avatar:"🙈", level:1 },
  { gombal:"Kalau kamu adalah cuaca, pasti kamu cerah setiap hari. Karena kamu selalu bikin hari-hariku terang.", reaksi:"Aduh... aku jadi senyum-senyum sendiri nih 😳", avatar:"😳", level:2 },
  { gombal:"Aku nggak percaya cinta pada pandangan pertama... sampai aku pertama kali lihat kamu.", reaksi:"Kamu ini ya... bisa-bisanya ngomong gitu 🫠", avatar:"🫠", level:2 },
  { gombal:"Matamu itu serius bikin aku susah fokus. Kayak ada magnet yang bikin aku selalu mau lihat kamu.", reaksi:"Hiii aku mau sembunyi aja deh kamu bikin aku malu 🥺", avatar:"🥺", level:3 },
  { gombal:"Kalau rindu ini bisa diukur, jaraknya pasti lebih jauh dari bintang paling ujung di galaksi.", reaksi:"Ya Allah kamu ini... aku beneran speechless deh 😭", avatar:"😭", level:3 },
  { gombal:"Bukan karena kamu sempurna aku suka sama kamu. Tapi karena kamu bikin aku merasa jadi versi terbaik dari diri aku.", reaksi:"Aku nggak tau harus jawab apa... tapi hatiku penuh banget 🥰", avatar:"🥰", level:4 },
  { gombal:"Aku harap kamu tau, nggak ada satu pun hari yang aku lewatin tanpa kepikiran soal kamu.", reaksi:"Jangan ngomong gitu dong... aku jadi nggak bisa berhenti senyum 🌸", avatar:"🌸", level:4 },
  { gombal:"Kalau dunia ini punya satu orang yang paling aku mau ada di sampingku selamanya... itu kamu.", reaksi:"Aku... aku nggak tau mau bilang apa. Makasih udah ada buat aku 💕", avatar:"😍", level:5 },
  { gombal:"Dan satu hal lagi yang perlu kamu tau... aku serius sama semua yang aku bilang tadi. Setiap kata. 💌", reaksi:"Aku percaya kamu. Dan aku bahagia banget ada kamu di hidupku 🥹❤️", avatar:"🥹", level:5 },
];

const dataBoy = [
  { gombal:"Eh maaf ya tiba-tiba chat... tapi aku nggak bisa nggak bilang, kamu cantik banget hari ini 😳", reaksi:"Hah?! Apaan sih tiba-tiba~", avatar:"😏", level:1 },
  { gombal:"Tiap kali kamu senyum, aku lupa semua yang mau aku omongin.", reaksi:"Ih kamu bisa aja! Lebay deh 🙈", avatar:"🙈", level:1 },
  { gombal:"Kalau kamu adalah lagu, pasti aku putar repeat terus... karena aku nggak pernah bosen lihat kamu.", reaksi:"Aduh... aku jadi senyum-senyum sendiri nih 😳", avatar:"😳", level:2 },
  { gombal:"Aku nggak percaya cinta pada pandangan pertama... sampai aku pertama kali lihat kamu.", reaksi:"Kamu ini ya... bisa-bisanya ngomong gitu 🫠", avatar:"🫠", level:2 },
  { gombal:"Matamu itu serius bikin aku susah fokus. Kayak ada magnet yang selalu narik perhatianku ke kamu.", reaksi:"Hiii aku mau sembunyi aja deh kamu bikin aku malu 🥺", avatar:"🥺", level:3 },
  { gombal:"Kalau rindu ini bisa diukur, jaraknya pasti lebih panjang dari semua mimpi yang pernah aku punya.", reaksi:"Ya Allah kamu ini... aku beneran speechless 😭", avatar:"😭", level:3 },
  { gombal:"Bukan karena kamu sempurna aku suka sama kamu. Tapi karena kamu bikin aku merasa jadi versi terbaik dari diri aku.", reaksi:"Aku nggak tau harus jawab apa... tapi hatiku penuh banget 🥰", avatar:"🥰", level:4 },
  { gombal:"Aku harap kamu tau, nggak ada satu pun hari yang aku lewatin tanpa kepikiran soal kamu.", reaksi:"Jangan ngomong gitu dong... aku jadi nggak bisa berhenti senyum 🌸", avatar:"🌸", level:4 },
  { gombal:"Kalau dunia ini punya satu orang yang paling aku mau ada di sampingku selamanya... itu kamu.", reaksi:"Aku... aku nggak tau mau bilang apa. Makasih udah ada buat aku 💕", avatar:"😍", level:5 },
  { gombal:"Dan satu hal lagi yang perlu kamu tau... aku serius sama semua yang aku bilang tadi. Setiap kata. 💌", reaksi:"Aku percaya kamu. Dan aku bahagia banget ada kamu di hidupku 🥹❤️", avatar:"🥹", level:5 },
];

// ===== STATE =====
let data = [];
let idx  = 0;
let busy = false;
let gender = '';
let sentGombals = [];

function nowTime() {
  const d = new Date();
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

function startGame(g) {
  gender = g;
  data   = g === 'girl' ? dataGirl : dataBoy;
  idx    = 0;
  sentGombals = [];

  if (g === 'girl') {
    document.getElementById('partnerName').textContent = 'Abang 💙';
    document.getElementById('partnerAv').innerHTML     = '😏<div class="online-dot"></div>';
  } else {
    document.getElementById('partnerName').textContent = 'Sayang 💕';
    document.getElementById('partnerAv').innerHTML     = '😊<div class="online-dot"></div>';
  }

  document.getElementById('pickScreen').style.display = 'none';
  document.getElementById('phone').style.display      = 'flex';
  updatePreview();
}

function backToMenu() {
  document.getElementById('phone').style.display      = 'none';
  document.getElementById('pickScreen').style.display = 'flex';
  document.getElementById('endOverlay').style.display = 'none';
  document.getElementById('chat').innerHTML  = '<div class="date-badge">Hari ini</div>';
  document.getElementById('meterBar').style.width = '0%';
  idx = 0; busy = false;
}

// ===== KIRIM GOMBAL =====
function sendNext() {
  if (busy || idx >= data.length) return;
  busy = true;

  const item = data[idx];
  const btn  = document.getElementById('sendBtn');
  btn.disabled = true;

  // 1. Tampilkan bubble kamu (kanan)
  addMyBubble(item.gombal);
  sentGombals.push(item.gombal);

  // 2. Setelah jeda, pasangan mengetik...
  setTimeout(() => {
    showTyping(item.avatar);

    // 3. Pasangan balas
    setTimeout(() => {
      hideTyping();
      addPartnerBubble(item.avatar, item.reaksi);
      updateMeter(idx + 1);

      // Update avatar di topbar
      const av = document.getElementById('partnerAv');
      av.innerHTML = item.avatar + '<div class="online-dot"></div>';
      av.classList.remove('react'); void av.offsetWidth; av.classList.add('react');
      setTimeout(() => av.classList.remove('react'), 600);

      // Floating hearts tiap 2 pesan
      if ((idx + 1) % 2 === 0) burstHearts();

      idx++;
      busy = false;
      btn.disabled = false;

      if (idx >= data.length) {
        document.getElementById('previewBox').innerHTML = '<span style="color:#ec4899">Kamu udah kirim semua gombal! 🎉</span>';
        btn.textContent = '🎉 Lihat Hasil';
        btn.onclick = showEnd;
        document.getElementById('progressText').textContent = '';
      } else {
        updatePreview();
      }
    }, 1400);
  }, 600);
}

function updatePreview() {
  if (idx >= data.length) return;
  const item = data[idx];
  const total = data.length;
  document.getElementById('previewBox').innerHTML =
    `<span style="color:rgba(255,255,255,0.35);font-size:0.7rem;">Gombal ${idx+1}/${total} — preview:</span><br><span>${item.gombal.slice(0,65)}${item.gombal.length>65?'...':''}</span>`;
  document.getElementById('progressText').textContent = `${total - idx - 1} gombal lagi tersisa`;
  document.getElementById('sendBtn').textContent = '💌 Kirim Gombal';
  document.getElementById('sendBtn').onclick = sendNext;
}

// ===== DOM HELPERS =====
function addMyBubble(text) {
  const chat = document.getElementById('chat');
  const row  = document.createElement('div');
  row.className = 'row-right anim-right';
  row.innerHTML = `
    <div class="bubble-right">
      ${text}
      <div class="time">${nowTime()} <span class="tick">✓✓</span></div>
    </div>`;
  chat.appendChild(row);
  scrollBottom();
}

function addPartnerBubble(avatar, text) {
  const chat = document.getElementById('chat');
  const row  = document.createElement('div');
  row.className = 'row-left anim-left';
  row.innerHTML = `
    <div class="av-sm">${avatar}</div>
    <div class="bubble-left">
      ${text}
      <div class="time">${nowTime()}</div>
    </div>`;
  chat.appendChild(row);
  scrollBottom();
}

let typingEl = null;
function showTyping(avatar) {
  document.getElementById('statusOnline').style.display = 'none';
  document.getElementById('statusTyping').style.display = 'block';
  const chat = document.getElementById('chat');
  typingEl = document.createElement('div');
  typingEl.className = 'typing-row anim-left';
  typingEl.innerHTML = `
    <div class="av-sm">${avatar}</div>
    <div class="typing-bubble">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>`;
  chat.appendChild(typingEl);
  scrollBottom();
}
function hideTyping() {
  document.getElementById('statusOnline').style.display = 'block';
  document.getElementById('statusTyping').style.display = 'none';
  if (typingEl) { typingEl.remove(); typingEl = null; }
}

function updateMeter(count) {
  const pct = Math.round((count / data.length) * 100);
  document.getElementById('meterBar').style.width = pct + '%';
}

function scrollBottom() {
  const c = document.getElementById('chat');
  setTimeout(() => c.scrollTop = c.scrollHeight, 60);
}

// ===== END GAME =====
function showEnd() {
  const total = data.length;
  let big, title, desc;
  big   = '💍';
  title = 'GOMBAL MASTERCLASS! 🔥';
  desc  = `Kamu berhasil ngirim ${total} gombal sekaligus!\nDia pasti udah baper berat dan nggak bisa nolak kamu~ 🥹❤️`;
  document.getElementById('endBig').textContent   = big;
  document.getElementById('endTitle').textContent = title;
  document.getElementById('endDesc').textContent  = desc;
  document.getElementById('endOverlay').style.display = 'flex';
  burstHearts(20);
}

function resetGame() {
  idx = 0; busy = false; sentGombals = [];
  document.getElementById('endOverlay').style.display = 'none';
  document.getElementById('chat').innerHTML = '<div class="date-badge">Hari ini</div>';
  document.getElementById('meterBar').style.width = '0%';
  document.getElementById('sendBtn').textContent = '💌 Kirim Gombal';
  document.getElementById('sendBtn').onclick = sendNext;
  document.getElementById('sendBtn').disabled = false;

  // Reset partner avatar
  if (gender === 'girl') {
    document.getElementById('partnerAv').innerHTML = '😏<div class="online-dot"></div>';
  } else {
    document.getElementById('partnerAv').innerHTML = '😊<div class="online-dot"></div>';
  }
  updatePreview();
}

function shareWA() {
  const last = sentGombals[sentGombals.length - 1] || '';
  const msg  = encodeURIComponent(
    `💌 *Hai sayang...*\n\n"${last}"\n\n_(Dan masih banyak lagi yang mau aku bilang... 💕)_`
  );
  window.open('https://wa.me/?text=' + msg, '_blank');
}

// Floating hearts
function burstHearts(n = 7) {
  const e = ['❤️','💕','💖','🌹','✨','💘','🌸','💗'];
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      const h = document.createElement('div');
      h.className = 'fh';
      h.textContent = e[Math.floor(Math.random()*e.length)];
      h.style.fontSize = (0.9 + Math.random()*1) + 'rem';
      h.style.left     = (5 + Math.random()*90) + 'vw';
      h.style.bottom   = '80px';
      h.style.animationDuration = (3 + Math.random()*3) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 7000);
    }, i * 110);
  }
}

// Ambient hearts
setInterval(() => {
  if (Math.random() > 0.75 && document.getElementById('phone').style.display !== 'none') {
    burstHearts(1);
  }
}, 3000);
</script>
</body>
